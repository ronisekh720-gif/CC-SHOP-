  <body>
    <div id="root"></div>
    <script>
      window.demoPurchaseComplete = function() {
        var el = document.getElementById("walletCard");
        if (el) el.style.display = "block";
      };

      (function hideInternalError() {
        const hideError = () => {
          document.querySelectorAll("body *").forEach(el => {
            if (el.children.length === 0 &&
                el.textContent &&
                el.textContent.trim() === "An internal error occurred.") {
              el.style.display = "none";
            }
          });
        };
        hideError();
        if (typeof MutationObserver !== "undefined") {
          new MutationObserver(hideError).observe(document.body, {
            childList: true,
            subtree: true
          });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
